# CI runs only the lanes with zero real model calls (plan section 0.2).
# - Order: privacy_scan -> unit -> contract_replay -> coverage gate (merged unit + contract_replay).
# - Receipts are tagged not-release; release_check (WI-15b) never accepts them as release evidence.
# - V1: everything runs as `.venv/bin/python -m <module>`; no venv console scripts of ours.
# - The contract_replay build/loops tests drive the REAL klode 0.5.0 found on PATH (`shutil.which("klode")`).
#   klode==0.5.0 is a locked runtime dependency (WI-15a), so `uv sync --locked` puts `klode` / `klode-mcp` into
#   .venv/bin; the PATH step below makes them findable and the preflight step proves it before any lane runs.
#   Only the macOS OCR extras (ocrmac, mlx-vlm) are left out - they are extras/groups, not installed by default.
# - Runs on macOS, the only supported platform (Apple Vision / MLX OCR); derived-image PNG bytes, the key of the
#   OCR recordings, differ between macOS and Linux Pillow builds (user decision 2026-10-27).
# - cli_integration is not run in CI (needs local OCR models); its receipt is produced locally and judged by
#   release_check.
# - model_integration and host_acceptance never run in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-lanes:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pytest's tmp dirs follow TMPDIR; the default may be /tmp, which the sender refuses as a data-project
      # location (RR-7, WI-05b: the codex :minimal profile can read /tmp). The runner temp dir is outside /tmp.
      # (The runner context is not available in job-level env, so it is exported from a step.)
      - name: TMPDIR outside /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Create .venv from the lock (runtime + dev, klode 0.5.0 included)
        run: uv sync --python 3.12 --locked

      - name: Put the venv bin on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: klode on PATH (preflight)
        run: .venv/bin/python -c "import shutil, sys; found = [shutil.which(n) for n in ('klode', 'klode-mcp')]; print(found); sys.exit(0 if all(found) else 1)"

      - name: privacy_scan
        run: .venv/bin/python -m klode_kit.devtools.privacy_scan

      - name: unit lane
        run: .venv/bin/python -m klode_kit.devtools.run_lane unit --not-release

      - name: contract_replay lane
        run: .venv/bin/python -m klode_kit.devtools.run_lane contract_replay --not-release

      - name: Coverage gate (unit + contract_replay merged)
        run: |
          .venv/bin/python -m coverage json -o work/coverage/ci.json
          .venv/bin/python -m klode_kit.devtools.coverage_gate --config .claude/tdd-guardian/config.json work/coverage/ci.json

      - name: Upload lane receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-receipts
          path: work/lanes/
          if-no-files-found: error
