# klode-kit alias sources for deterministic cards (records_to_l1, WI-01b; design 02 r2.2-C, r3.4 R2-02).
#
# Gate 1 (F1) wants >= check_cards.MIN_ALIASES_DETERMINISTIC (1) aliases on a deterministic card (authored
# cards keep cards.min_aliases = 10; user decision 2026-10-24). The aliases of a card generated by
# records_to_l1 come ONLY from deterministic sources, never padded:
#   1. the item's display name, its items.yaml aliases and its slug;
#   2. [items.<slug>].names below: other names of the same item - English / Chinese full names, abbreviations,
#      common colloquial names. General vocabulary only: no clinical meaning, no reference range, no judgement;
#   3. the units written in the source, each followed by its spelling variants in [units] (a unit without any
#      letter or digit, such as "%", is never an alias);
#   4. record cards: the rec_id, the record date in five spellings, and the names (1-2) of every item in it.
# Fewer than the floor -> records_to_l1 stops (AliasShortage) and names the card.
# A name here must not be another items.yaml item's alias, nor contain "," "[" "]" or a backtick.
# Public repository: synthetic / general words only.

[items.hemoglobin]
names = ["haemoglobin", "血色素", "血红蛋白浓度", "hemoglobin concentration"]

[items.wbc]
names = ["white blood cell", "white blood cell count", "leukocyte", "leucocyte", "白血球", "白血球计数"]

[items.rbc]
names = ["red blood cell", "red blood cell count", "erythrocyte", "红血球", "红血球计数"]

[items.platelet]
names = ["platelet count", "thrombocyte", "thrombocyte count", "血小板数"]

[items.neutrophil-pct]
names = ["neutrophil percentage", "neutrophil %", "NE%", "N%", "中性粒细胞比率", "中性粒细胞百分数"]

[items.lymphocyte-pct]
names = ["lymphocyte percentage", "lymphocyte %", "LY%", "L%", "淋巴细胞比率", "淋巴细胞百分数"]

[items.creatinine]
names = ["血肌酐", "serum creatinine", "SCr"]

[items.alt]
names = ["alanine aminotransferase", "alanine transaminase", "GPT", "SGPT", "丙氨酸转氨酶"]

[units]
"g/L" = ["克/升"]
"10^9/L" = ["10⁹/L", "×10^9/L", "x10^9/L"]
"10^12/L" = ["10¹²/L", "×10^12/L", "x10^12/L"]
"μmol/L" = ["umol/L", "微摩尔/升"]
"mmol/L" = ["毫摩尔/升"]
"U/L" = ["IU/L"]
