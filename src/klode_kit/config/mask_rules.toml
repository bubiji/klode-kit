# Header-masking rules (WI-05a, klode_kit.audit.mask; design 02 r2.2-B).
# Ships inside the package beside defaults.toml (config is a package, see impl-deviations WI-00b2).
# Changing this file changes mask.tool_version (it carries the sha of this file), so the MANIFEST row of a
# page masked under other rules is distinguishable.

# A Vision line (one row of observations) whose text, with spaces removed, contains one of these CJK keywords is masked
# over its whole row. Pure-ASCII keywords match case-insensitively and only as a whole word
# ("ID" matches "Patient ID:" but not "LIPID").
keywords = [
    # Simplified / Traditional Chinese
    "姓名", "患者", "病人", "编号", "編號", "病历号", "病歷號", "病案号", "住院号", "住院號", "门诊号", "門診號",
    "床号", "床號", "卡号", "卡號", "身份证", "身份證", "医保", "醫保", "电话", "電話", "手机", "手機",
    "地址", "联系人", "聯繫人",
    # Japanese
    "氏名", "患者名", "患者番号", "患者ID", "カルテ", "診察券", "受付番号", "被保険者", "保険者番号",
    "記号番号", "生年月日", "住所", "連絡先", "フリガナ", "ふりがな",
    # English
    "ID", "MRN", "Name", "Patient", "DOB", "Tel", "Phone",
]

# Regular expressions searched in the line text as read (spaces kept, so numbers in separate table cells are
# never joined); a match masks the row like a keyword.
# - letters, an optional dash and at least 6 digits (record / card numbers such as "T-0000001");
# - 9 or more digits (ID card, phone and insurance numbers; an 8-digit compact date is NOT matched);
# - dashed phone numbers starting with 0 ("03-1234-5678", "090-1234-5678").
patterns = [
    '[A-Za-z]{1,3}-?\d{6,}',
    '\d{9,}',
    '0\d{1,4}-\d{1,4}-\d{3,4}',
]

# The top band of every page (fraction of the page height) is always masked, and so is every line that
# reaches into it: the hospital name, logo and the header block usually live there.
header_band = 0.08

# Padding around a line box: max(pad_px, round(pad_frac * line height)) on each side.
pad_px = 4
pad_frac = 0.3

# Mask the whole page width of a matched row (a header row often holds name, sex, age and number side by side).
full_width = true
